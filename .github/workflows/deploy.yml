name: Deploy to Cloudflare Workers

# Авто-деплой при пуше в main. Запуск вручную — через кнопку "Run workflow".
on:
  push:
    branches: [main]
    # Не гоняем деплой, если изменились только документация/мета-файлы.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dev.vars.example"
  workflow_dispatch:

# Не даём параллельным деплоям накладываться друг на друга;
# новый пуш отменяет предыдущий незавершённый деплой.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Typecheck & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
